---
layout: default
---
<article class="post">
  <div class="page-head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-meta">{{ page.subtitle }}</p>{% endif %}
  </div>
  <div class="page-body">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
