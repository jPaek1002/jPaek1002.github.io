title: Jay Paek
tagline: Electrical Engineering · UCSD
description: >-
  Personal website of Jay Paek — electrical engineering, control theory,
  numerical analysis, robotics, and cool math problems.
author: Jay Paek
email: jpaek@ucsd.edu
url: "https://jpaek1002.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/

kramdown:
  input: GFM
  hard_wrap: false

# Blog listing on the /blog/ page
paginate: false

# Top navigation menu (rendered in the sidebar)
nav:
  - title: About me
    url: /
  - title: Experience
    url: /experience/
  - title: Projects
    url: /projects/
  - title: Courses
    url: /courses/
  - title: Publications
    url: /publications/
  - title: Resources
    url: /resources/
  - title: Life Blog
    url: /blog/
  - title: Research Blog
    url: /research/
  - title: CV
    url: /FullCV.pdf

# Collections
collections:
  research:
    output: true
    permalink: /research/:year/:month/:day/

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: research
      math: true

# Files/dirs Jekyll should not copy into the build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .claude
  - jemall.sh
  - "*.jemdoc"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
